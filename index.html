<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUS MSBA Antigravity Lab - joyce-jhdong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --badge-bg: rgba(34, 197, 94, 0.15);
      --badge-border: rgba(34, 197, 94, 0.4);
      --badge-text: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 640px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--badge-text);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    h1 span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .divider {
      height: 1px;
      background: var(--card-border);
      margin: 24px 0;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      text-align: left;
    }

    .meta-item {
      background: rgba(15, 23, 42, 0.4);
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .meta-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .meta-val {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="badge">
        Status: Initial Environment Verification Passed ✅
      </div>
      <h1>Hi NUS Antigravity Hackathon! I am <span>joyce-jhdong</span></h1>
      <p class="subtitle">NUS MSBA 'Build with Antigravity' Hands-on Lab (2026-11-23)</p>
      
      <div class="divider"></div>

      <div class="meta-grid">
        <div class="meta-item">
          <div class="meta-label">Track</div>
          <div class="meta-val">COE Price Intelligence</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Author</div>
          <div class="meta-val">Jiahui Dong</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Protocol</div>
          <div class="meta-val">Strict Isolation</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
